line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    "B008",  # function-call-in-default-argument: FastAPI's Depends()/Query() pattern
    # Pre-existing debt at the time linting was introduced (45 occurrences,
    # mostly in tests) — not auto-fixable, left as follow-up so CI isn't
    # blocked on day one. Re-enable once cleaned up.
    "F841",  # unused-variable
    "E712",  # true-false-comparison
    "B904",  # raise-without-from-inside-except
    "E402",  # module-import-not-at-top-of-file
]

[lint.per-file-ignores]
"tests/*" = ["B011"]
